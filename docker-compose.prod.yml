# =============================================================================
# Production Docker Compose — Invoice Maker
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Services:
#   Caddy (:80/:443) → frontend (internal :80) + backend (internal :8080)
#   PostgreSQL (internal only, kecuali explicit expose)
# =============================================================================

services:
  # ── Reverse Proxy + Auto SSL ────────────────────────────────────────────
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: invoice-caddy-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN harus diset di .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q '<!DOCTYPE\\|<html'"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Database ────────────────────────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: invoice-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-invoiceuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD harus diset di .env.prod}
      POSTGRES_DB: ${DB_NAME:-invoicedb}
    # PostgreSQL TIDAK di-expose ke internet. Hanya bisa diakses dari
    # dalam Docker network. Kalau perlu akses remote, buka port via SSH tunnel:
    #   ssh -L 5432:localhost:5432 user@vps
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-invoiceuser} -d ${DB_NAME:-invoicedb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-backend-prod
    # Port TIDAK di-expose ke host — hanya diakses oleh Caddy via
    # Docker internal network (service name "backend" resolve ke container).
    expose:
      - "8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-invoiceuser}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD harus diset di .env.prod}
      DB_NAME: ${DB_NAME:-invoicedb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET harus diset di .env.prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      LOG_FORMAT: json
      LOG_LEVEL: info
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (SPA via nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice-frontend-prod
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q '<!DOCTYPE\\|<div id=\"root\"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:
